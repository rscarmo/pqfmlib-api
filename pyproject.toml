[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqfmlib"
version = "0.5.0"
description = "Projected Quantum Feature Maps for tabular machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rafael Carmo" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
  "qiskit-ibm-runtime>=0.25",
]

[project.optional-dependencies]
tilelang = [
  "torch>=2.5",
  "tilelang>=0.1.15,<0.1.16",
]
cudaq = [
  "cuda-quantum-cu12>=0.16,<0.17",
]
examples = [
  "shap>=0.45",
  "matplotlib>=3.10.9",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pqfmlib*"]
