[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqfmlib"
version = "0.1.0"
description = "Projected Quantum Feature Maps for tabular machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rafael Carmo" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
  "qiskit-ibm-runtime>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pqfmlib*"]
